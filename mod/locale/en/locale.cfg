[item-description]
colony-basket=Lets a colonist forage. Wears out.
colony-axe=Lets colonists chop trees. Wears out.
colony-pickaxe=Lets colonists mine ore. Wears out.
colony-forage=Berries, roots and mushrooms gathered by colonists. Spoils.
colony-logistics-marker=Drag over machines to have colonists supply them. Alt-drag to stop supplying them. Only works inside colony territory.
colony-farm-plot=Place on farmland inside colony territory. A farm hut will plant and harvest it.
colony-produce=Vegetables grown by colony farmers. Eaten by colonists; spoils.
colony-bread=Fresh bread baked from farm produce and water. Keeps well (60 min).
colony-ale=Brewed from farm produce and fresh water. Taverns pour it.
colony-compost-bin=Colonists clear spoiled food out of houses and colony stock into this bin. Ten spoilage rot down into one fertilizer.
colony-fertilizer=Rotted-down spoilage from the compost bin. Farmers will put it to use soon.
colony-rifle=Lets a hunter shoot game. Wears out.
colony-meat=Shot game, butchered by the hunters. Eaten by colonists; spoils.
colony-hunting-lodge=Up to 3 colonists hunt the roaming game inside colony territory. Needs one rifle per hunter, delivered from the Town Hall.
colony-hoe=Lets a colonist tend farm plots. Wears out.
colony-rod=Lets a fisher work the water. Wears out.
colony-fish=Fresh fish from the colony fishing dock. Eaten by colonists; spoils faster than meat.
colony-salt=Raked out of a salt pan. A Smokehouse needs it to cure meat and fish.
colony-preserved-meat=Salted and smoked meat. Eaten last, because it keeps about three times as long.
colony-preserved-fish=Salted and smoked fish. Eaten last, because it keeps about three times as long.
colony-water=Fresh water drawn from a well or bottled at an assembler. Colonists drink it to survive in higher-tier housing.
colony-furniture=Chairs and tables crafted for colonists. Increases comfort and desirability in apartment blocks.
colony-frontier-pack=Early colony research charter written on wood and stone using preserved food rations. Spoils in 60 minutes.
colony-civic-pack=Advanced treatise on colony civic administration crafted from bread, fresh water, and iron gears. Spoils in 60 minutes.

