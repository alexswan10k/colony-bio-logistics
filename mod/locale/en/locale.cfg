[entity-description]
colony-debug-generator=Free 10 MW of power. Debug only.
colony-town-hall=Claims colony territory in a 64-tile radius around itself. Its inventory is the colony stock: put food, tools and building materials here and colonists deliver them where needed.
colony-housing-tent=Houses 4 colonists. Needs food and wood (heat) delivered by colonists - or put them in yourself.
colony-housing-cabin=Houses 6 colonists. Needs food; heat from wood OR electricity (power pole in range).
colony-housing-homestead=Houses 8 colonists. Needs food, water, and heat (from wood/coal OR electricity). Upgraded from a cabin.
colony-housing-apartment=Houses 16 colonists. Needs food, water, electricity (mandatory), and comfort goods (furniture).
colony-ledger=Reads the colony's own inventory onto the circuit network: every 60 ticks it republishes the colony ledger as item signals, so a belt, inserter or pump can react to what the town holds without anyone opening a GUI. Publish stock (how much the town has) or shortfall (how much more it still wants against its quotas). Place it inside territory and wire it up - it needs no worker and no fuel.
colony-well=Draws water from the ground. Automatically fills with water buckets. Nobody works it: haulers empty it into colony stock.
colony-forager-hut=Up to 3 colonists forage here. Needs one basket per forager (colonists deliver them from the Town Hall). Harvests natural forage patches within 48 tiles of the hut; another colony's land is out of bounds. Harvested patches grow back in place.
colony-woodcutter-hut=Up to 3 colonists chop trees within 48 tiles of the hut (another colony's land is out of bounds). Needs one axe per woodcutter, delivered from the Town Hall. Steel Tools upgrade this to a steel axe: no wood, longer-lasting, faster.
colony-miner-hut=Up to 3 colonists mine ore within 48 tiles of the hut (another colony's land is out of bounds). Needs one pickaxe per miner, delivered from the Town Hall. Steel Tools upgrade this to a steel pickaxe: no wood, longer-lasting, faster.
colony-watchtower=Build it inside colony territory to claim a 48-tile radius around it, pushing the colony's working area outward. Removing it shrinks the territory back again.
colony-farm-hut=Up to 3 colonists tend farm plots within 48 tiles of the hut. Needs one hoe per farmer, delivered from the Town Hall. Steel Tools upgrade this to a steel hoe: no wood, longer-lasting, faster. Farmers plant fallow plots, wait for the crop to ripen, then harvest colony produce.
colony-forester-hut=Up to 2 colonists replant trees within 20 tiles of the hut, filling the gaps a woodcutter has opened: nothing is planted within 4 tiles of a standing tree, and only on grass or dirt. Needs one spade per forester, delivered from the Town Hall. Each tree costs one wood out of the hut's own chest - haulers keep it stocked - and a woodcutter gets 4 wood back out of it later. This is how a mature colony keeps wood coming in after it has cut its own forest down.
colony-hunting-lodge=Up to 3 colonists hunt roaming game within 48 tiles of the hut. Needs one rifle per hunter, delivered from the Town Hall. Hunters shoot game and carry the meat back here.
colony-salt-pan=Evaporates salt out of the water beside it. Needs water in reach when built, like the Fishing Dock. Nobody works it: haulers empty it into colony stock.
colony-smokehouse=Cures raw meat and fish with salt into preserved food that keeps far longer. No tools needed - bring it salt and something to cure.
colony-kitchen=Bakes farm produce and water into bread that keeps well. No tools needed - bring it produce and fresh water.
colony-toolsmith=A worker slowly makes tools (baskets, axes, pickaxes, hoes, rods, rifles, steel tools) from wood, iron, copper and steel that haulers bring. Makes tools huts are waiting for (tier-1 first), then keeps one spare of each tier.
colony-tavern=Serves ale to every house within 24 tiles. Served colonists enjoy themselves (desirability) and are Inspired: they work 25% faster. Haulers keep it stocked with ale.
colony-cemetery=Buries the colony's dead. A colony with a cemetery mourns each death for half as long (the death penalty on desirability fades twice as fast). Holds 12 graves; when every cemetery is full, the dead are buried where they fell.
colony-grave=A colonist died here. Mine it to clear the spot.
colony-motor-pool=Put cars and fuel in it. When there is a big load to move, a hauler checks out a car and drives it as a truck that carries five colonists' worth. Fuel (coal, wood or solid fuel) is hauled here automatically, and cars in colony stock are brought here too.
colony-truck=A colony car driven by a hauler. It goes back to the Motor Pool to refuel and parks there when there is nothing big to move.
colony-passenger-platform=Build within 10 tiles of a train stop. Colonists who would otherwise leave town (or have no bed) wait here, and ride the next train with a Passenger Coach to another colony that has free beds.
colony-canteen=Turns a colony into a commuter outpost. While it holds food, idle colonists from other rail-linked towns ride in by Passenger Coach to fill its empty job slots, eat here instead of needing beds, and ride home at nightfall. Haulers keep it stocked with food.
colony-clinic=Doctors cure the colony's sick here, one Herbal Medicine per patient. Sick colonists work at half speed, and Smoker's Lung kills if it is not treated. Haulers keep it stocked with medicine.
colony-passenger-coach=Carries up to 20 colonists between Passenger Platforms. Riders get off at the first other colony with free beds.
colony-town-archive=Early research center where scholars study Frontier Charters to unlock initial colony technologies. Staffed by up to 2 scholars.
colony-university=Advanced research institution where scholars study Frontier Charters and Civic Treatises to unlock mid- and late-game colony advancements. Staffed by up to 4 scholars.
colony-fishing-dock=Up to 3 colonists fish here. Needs one rod per fisher, delivered from the Town Hall, and water beside it: a dock with fewer than six water tiles within 15 tiles is refused when built.
colony-wild-boar=Game that wanders the colony's territory. Harmless: it runs from nothing and fights nothing, and a hunter's rifle is the only thing that kills it. Butcher it for meat.
colony-farm-plot=Place on grass, dirt or other farmland inside colony territory. A farm hut plants and harvests it. Poor soil (dry dirt, desert, sand) yields less; water and paving cannot be farmed.
colony-supply-crate=Colonists empty this crate into colony stock, so belt or inserter output can hand off to the colony without routing everything into the Town Hall.
colony-demand-crate=Set item filters here and colonists fill the crate from colony stock, so inserters can pull from it. Each row is an item and a target count.
colony-warehouse=Bulk colony storage. Colonists source from it when the Town Hall runs low and deposit overflow here.
colony-haul-station=Bulk colony storage with a Wooden Trailer rack. Put Wooden Trailers here: when there is a big load to move and no Motor Pool truck can take it, a hauler within 48 tiles checks a trailer out for one 3x hand-load on foot, cheap bulk hauling before the Motor Pool. The trailer breaks after 30 trips and is replaced from the rack. Buildings and finished goods inside are storage, like a Warehouse.
colony-compost-bin=Colonists bring spoiled food here. It rots down into fertilizer, so a house never fills up with garbage.

