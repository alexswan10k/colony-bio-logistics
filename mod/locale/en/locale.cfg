[technology-description]
colony-settlement=Tents for colonists to live in, a Forager's Hut for food and a Woodcutter's Hut for the wood that heats the tents. Put baskets and axes in the Town Hall, or the wood and iron for its workshop to make them.
colony-mining=Miners for stone and ore, cabins, a compost bin for spoiled food, and crates and warehouses for bulk stock.
colony-hunting-fishing=Hunting Lodges and Fishing Docks: meat and fish to feed a bigger town.
colony-logistics=Watchtowers to push the territory outward, and demand crates and the logistics marker to hook colonists into the factory.
colony-food-preservation=Salt Pans and Smokehouses cure meat and fish so it keeps, and the Town Archive turns preserved food into Frontier Charters for colony research.
colony-frontier-charter=Establishes formal colony charters and unlocks drafting Frontier Charters from preserved fish.
colony-water-infrastructure=Unlocks colony wells, water bottling, homestead cottages, and comfortable furniture.
colony-advanced-agriculture=Unlocks farm huts, farm plots, and hoes to establish agricultural food production.
colony-civic-governance=Unlocks the University, Civic Treatises, apartment blocks, and colony kitchens.
colony-motor-pool=Haulers drive cars from a Motor Pool to move big loads quickly.
colony-recreation=Taverns and ale: a reason to stay, and a spring in every step.

