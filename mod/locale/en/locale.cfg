[technology-description]
colony-settlement=Tents, a Forager's Hut and a Woodcutter's Hut to start a colony, plus a Miner's Hut, a Toolsmith, a Compost Bin, supply crates and the Town Archive. Put baskets, axes and pickaxes in the Town Hall, or let the Toolsmith make them from wood, iron and copper. Research starts here: Frontier Charters are drafted from gathered food.
colony-frontier-charter=Formalises colony research. Unlocks the Frontier Charter (fish) recipe and is the gateway to the rest of the colony technology tree.
colony-permanent-housing=Solid wooden cabins that house up to 6 colonists, replacing primitive tents and improving living standards.
colony-ledger=Publishes the colony's inventory as circuit signals, so the factory around the town can serve it automatically.
colony-warehousing=High-capacity warehouses that expand colony storage with configurable storage priorities and item whitelists.
colony-cemetery=Dedicated burial grounds for fallen colonists. Halves mourning duration and alleviates desirability penalties.
colony-hunting-fishing=Hunting Lodges and Fishing Docks: meat and fish to feed a bigger town. Unlocks wooden bows and arrows for early hunting and defense.
colony-logistics=Watchtowers to push the territory outward, demand crates and the logistics marker to hook colonists into the factory, and colony rifles for the watchtower garrison. Vanilla firearms need no colony research: haul a gun and its magazines to a hut or tower and the guards will use them.
colony-food-preservation=Salt Pans and Smokehouses cure meat and fish so it keeps. Preserved food is also the efficient route into Frontier Charters: one preserved item drafts three packs.
colony-water-infrastructure=Unlocks colony wells, water bottling, homestead cottages, and comfortable furniture.
colony-advanced-agriculture=Unlocks farm huts, farm plots, and hoes to establish agricultural food production, plus the Forester's Hut and spades to replant the forest after it has been cut.
colony-civic-governance=Unlocks the University, Civic Treatises, apartment blocks, and colony kitchens.
colony-motor-pool=Haulers drive cars from a Motor Pool to move big loads quickly.
colony-recreation=Taverns and ale: a reason to stay, and a spring in every step.
colony-medicine=Clinics and Herbal Medicine: doctors cure Smoker's Lung and Food Poisoning.
colony-steel-tools=Steel axes, pickaxes and hoes: no wood, last 45 trips, work 20% faster. The Toolsmith fills with tier-1 first, then upgrades to steel as replacements.
colony-rail-transit=Passenger Platforms and Coaches: colonists move between your colonies by train.

