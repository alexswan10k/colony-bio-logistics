[entity-description]
colony-town-hall=Claims 3x3 chunks of colony territory. Stock food here.
colony-housing-tent=Houses 4 colonists. Needs food and wood (heat) delivered by colonists - or put them in yourself.
colony-housing-cabin=Houses 6 colonists. Needs food; heat from wood OR electricity (power pole in range).
colony-forager-hut=Up to 3 colonists forage here. Needs one basket per forager (colonists deliver them from the Town Hall). Harvests natural forage patches within 30 tiles inside colony territory; harvested patches grow back in place.
colony-woodcutter-hut=Up to 3 colonists chop trees within 30 tiles inside colony territory. Needs one axe per woodcutter, delivered from the Town Hall.
colony-miner-hut=Up to 3 colonists mine ore within 30 tiles inside colony territory. Needs one pickaxe per miner, delivered from the Town Hall.
colony-watchtower=Build it inside colony territory to claim the 3x3 chunks around it, pushing the colony's working area outward. Removing it gives those chunks back.
colony-farm-hut=Up to 3 colonists tend farm plots within 30 tiles inside colony territory. Needs one hoe per farmer, delivered from the Town Hall. Farmers plant fallow plots, wait for the crop to ripen, then harvest colony produce.
colony-hunting-lodge=Up to 3 colonists hunt roaming game within 30 tiles inside colony territory. Needs one rifle per hunter, delivered from the Town Hall. Hunters shoot game and carry the meat back here.
colony-salt-pan=Evaporates salt out of the water beside it. Needs water in reach when built, like the Fishing Dock. Nobody works it: haulers empty it into colony stock.
colony-smokehouse=Cures raw meat and fish with salt into preserved food that keeps far longer. No tools needed - bring it salt and something to cure.
colony-fishing-dock=Up to 3 colonists fish here. Needs one rod per fisher, delivered from the Town Hall, and water beside it: a dock with fewer than six water tiles within 15 tiles is refused when built.
colony-wild-boar=Game that wanders the colony's territory. Harmless: it runs from nothing and fights nothing, and a hunter's rifle is the only thing that kills it. Butcher it for meat.
colony-farm-plot=Place on grass, dirt or other farmland inside colony territory. A farm hut plants and harvests it. Poor soil (dry dirt, desert, sand) yields less; water and paving cannot be farmed.
colony-supply-crate=Colonists empty this crate into colony stock, so belt or inserter output can hand off to the colony without routing everything into the Town Hall.
colony-demand-crate=Set item filters here and colonists fill the crate from colony stock, so inserters can pull from it. Each row is an item and a target count.
colony-warehouse=Bulk colony storage. Colonists source from it when the Town Hall runs low and deposit overflow here.
colony-compost-bin=Colonists bring spoiled food here. It rots down into fertilizer, so a house never fills up with garbage.

